# Versions used for the Fuchsia magellanica paper (runs A and B, Oct 2026).
#   conda env export --from-history -n duorganelle
# from the server if it differs.
name: duorganelle
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - novoplasty=4.3.5
  - getorganelle=1.7.7.1
  - spades=4.3.0
  - blast=2.17.0
  - minimap2=2.31
  - samtools=1.24
  - bbmap=40.05
  - coreutils        # timeout
